---
# Example GCP service account credentials secret consumed by the ProviderConfig.
#
# Steps:
#   1. Create a service account and JSON key in the GCP console.
#   2. Base64-encode the JSON key:
#        base64 -w0 service-account-key.json   # Linux/macOS
#        certutil -encode service-account-key.json | clip   # Windows
#   3. Paste the encoded value below and apply:
#        kubectl apply -f provider/credentials-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gcp-creds
  namespace: crossplane-system
type: Opaque
data:
  creds: BASE64_ENCODED_SERVICE_ACCOUNT_JSON
